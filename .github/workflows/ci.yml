name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build wasm
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Copy wasm into package root
        run: cp target/wasm32-unknown-unknown/release/tystats.wasm ./tystats.wasm

      - name: Install Typst
        uses: typst-community/setup-typst@v3

      - name: Compile docs
        run: typst compile docs.typ target/docs.pdf

      - name: Verify committed wasm runs identically
        run: |
          git checkout -- tystats.wasm
          typst compile docs.typ target/docs-committed.pdf
          echo "committed wasm compiled docs.typ cleanly"
